[workspace]
resolver = "2"
members = ["crates/systemgen", "crates/systemgen-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/matburt/systemgen-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
systemgen = { path = "crates/systemgen" }
